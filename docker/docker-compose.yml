services:

  # Optionnel — uniquement nécessaire si tu actives l'option Tor dans
  # docker/settings.yml (voir le bloc "outgoing" commenté dans
  # settings.yml.example). Sans ce service, SearXNG fonctionne
  # normalement sans passer par Tor.
  tor:
    image: dperson/torproxy
    container_name: ai_icp_tor
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: ai_icp_searxng

    # SearXNG is exposed only to the local machine.
    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - ./settings.yml:/etc/searxng/settings.yml

    environment:
      BASE_URL: http://localhost:8080/

    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ai_icp_app

    depends_on:
      - searxng

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-searxng}
      SEARXNG_BASE_URL: http://searxng:8080
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      DATABASE_URL: sqlite:////data/icp.db
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      ENRICHMENT_ENGINE: ${ENRICHMENT_ENGINE:-bs4}

    volumes:
      - icp_data:/data

    restart: unless-stopped

volumes:
  icp_data: