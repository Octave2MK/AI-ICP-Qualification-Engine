services:

  searxng:

    image: searxng/searxng:latest

    container_name: ai_icp_searxng

    # Expose SearXNG only to the local machine.
    # The container itself still listens on 0.0.0.0 internally.
    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - ./settings.yml:/etc/searxng/settings.yml

    environment:
      - BASE_URL=http://localhost:8080/

    restart: unless-stopped
