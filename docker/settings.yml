use_default_settings: true

server:
  # Placeholder officiel SearXNG. Usage 100% local (docker-compose sans
  # exposition réseau) : cette valeur par défaut n'est pas un risque tant
  # que le conteneur n'est jamais exposé au-delà de localhost.
  # Avant tout déploiement sur un serveur accessible depuis Internet,
  # générer une vraie valeur aléatoire avec :
  #   sed -i "s|ultrasecretkey|$(openssl rand -hex 32)|g" docker/settings.yml
  secret_key: "97dd2a4a3b6b0ac0321bf11d07e2e0b32e15bfd4804c5e93154984f80269ed8d"
  bind_address: "0.0.0.0"
  limiter: false

search:
  safe_search: 0
  formats:
    - html
    - json

ui:
  static_use_hash: true

botdetection:
  enabled: false

enabled_plugins:
  - Hash plugin

engines:
  - name: duckduckgo
    disabled: false

  - name: bing
    disabled: false

  - name: qwant
    disabled: false

  - name: mojeek
    disabled: false

  - name: brave
    disabled: true

  - name: startpage
    disabled: true

  - name: wikidata
    disabled: true